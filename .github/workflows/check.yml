name: Check and build
on: [push, pull_request, workflow_dispatch]
jobs:
  mobile-python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install ".[dev]"
      - run: python -m pip install ".[usb]"
      - run: python -m pytest tests -q
      - run: python -m build && python -m twine check dist/*
      - uses: astral-sh/setup-uv@v6
      - run: uvx --from . wifit3-mobile --version
      - run: uvx --from . wifit3-mobile-service --version
      - run: uvx --from . wifit3-mobile-htp --help
  mobile-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: wifit3-mobile-debug
          path: mobile/android/app/build/outputs/apk/debug/*.apk
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run client/wifisend.py --version
      - run: uv run client/wifisend.py --help
