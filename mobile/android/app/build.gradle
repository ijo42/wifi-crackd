plugins { id 'com.android.application' }
android {
    namespace 'org.wifit3.mobile'
    compileSdk 35
    defaultConfig {
        applicationId 'org.wifit3.mobile'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '0.4.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release { minifyEnabled false }
    }
}
