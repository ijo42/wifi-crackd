<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}wifi-crackd{% endblock %}</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<nav>
  <a href="/" class="brand">⚡ wifi-crackd</a>
  <div class="nav-links">
    <a href="/">Загрузка</a>
    {% if admin %}
      <a href="/admin">Админка</a>
      <a href="/admin/tokens">Токены</a>
      <a href="/admin/config">Конфиг</a>
      <form method="post" action="/logout" class="inline"><button class="link">Выход</button></form>
    {% else %}
      <a href="/login">Вход</a>
    {% endif %}
  </div>
</nav>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
