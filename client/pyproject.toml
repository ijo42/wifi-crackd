[project]
name = "wifisend"
version = "0.1.0"
description = "Отправка WPA-захватов (wifit3/wifite3) на сервер wifi-crackd"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["httpx>=0.27"]
license = { text = "GPL-2.0" }

[project.scripts]
wifisend = "wifisend:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["wifisend"]
